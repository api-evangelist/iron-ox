x-probe:
  date: '2026-08-23'
  method: probed
  findings:
  - host: ironox.com
    http_status: 200
    note: >-
      GoDaddy parking lander. Every path returns an identical 114-byte HTML
      redirect to /lander (window.LANDER_SYSTEM="PW", _trfd ap:"parking";
      nameservers ns71/ns72.domaincontrol.com). All 200s are soft-404s — no
      OpenAPI, Swagger, GraphQL, apis.json, agent card or .well-known document
      is actually served. The /llms.txt and /robots.txt it answers with are
      GoDaddy parking boilerplate whose sitemap contains only /lander; they are
      not Iron Ox artifacts and are not saved.
  - host: api.ironox.com
    http_status: 0
    note: NXDOMAIN
  - host: docs.ironox.com
    http_status: 0
    note: NXDOMAIN
  - host: developer.ironox.com
    http_status: 0
    note: NXDOMAIN
  - host: support.ironox.com
    http_status: 0
    note: NXDOMAIN — Zendesk help center linked from the 2023 site, DNS removed
  - host: github.com/iron-ox
    http_status: 200
    note: >-
      Genuine Iron Ox GitHub organization (name "Iron Ox", blog http://ironox.com,
      created 2015-10-10, avatar is the Iron Ox seedling logo). 47 public repos,
      42 of them forks of ROS-Industrial / MoveIt / Cartographer / vendor camera
      and arm drivers. The five first-party repos are ROS packages for internal
      robot control, not a product API contract. Last push 2022.
  - host: iron-ox.com
    http_status: 200
    note: >-
      NOT this company — "Iron Ox Physical Culture", a Chinese martial arts and
      Indo-Persian physical culture school in San Diego, California. Namesake
      only; deliberately not wired as a pointer.
  - host: inevitabletech.com
    http_status: 202
    note: >-
      NOT this company, despite Y Combinator's directory listing it as Iron Ox's
      website. Wayback shows the domain serving an unrelated offshore software
      development / mobile app agency continuously from 2011 through 2024; it is
      now behind a SiteGround captcha challenge. The YC link is stale. Deliberately
      not wired as a pointer (STEP 0c ownership check).
  conclusion: >-
    No operating host, no developer portal, no API, no machine-readable contract
    of any kind (OpenAPI, AsyncAPI, GraphQL SDL, MCP, A2A agent card, .proto,
    WSDL), and no first-party package in npm, PyPI, RubyGems or crates.io.
