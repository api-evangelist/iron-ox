description: 'Iron Ox (legally Inevitable Tech, Inc.) was a San Carlos, California
  robotics company that built autonomous indoor farms — hydroponic greenhouses worked
  by mobile transport robots and a robotic arm that seeded, moved, imaged and harvested
  leafy greens and herbs, with machine learning used to spot pests and disease plant
  by plant. Founded in 2015 by Brandon Alexander and Jon Binney, it went through Y
  Combinator (W16), raised roughly $98 million in total including a $53 million Series
  C led by Breakthrough Energy Ventures in September 2021, and ran greenhouses in
  Gilroy, California and Lockhart, Texas. It cut about half its staff — roughly 50
  people — in November 2022 and ceased operations in mid-2023. Iron Ox never ran a
  developer program: it sold produce, not software, and the only public code it ever
  shipped was internal ROS robotics tooling on GitHub. Its site, ironox.com, is now
  a GoDaddy parking lander and every developer subdomain has been removed from DNS,
  so there is no API, specification, SDK or documentation surface left to profile.'
